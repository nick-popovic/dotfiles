##### reload helper
unbind r
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

##### prefix (default is C-b; keep it consistent)
set -g prefix C-b

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 2
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

##### N12avigation & UX
set -g mouse on
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
set-option -g status-position top
set -s escape-time 10

##### Clipboard Setup
# Setup 'v' to begin selection as in Vim
bind -T copy-mode-vi v send-keys -X begin-selection
# Setup 'y' to yank (copy) and pipe to wl-clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

##### terminal + truecolor
# Use tmux-256color if your system has it, otherwise fall back to screen-256color.
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Enable truecolor (works with most modern terminals: alacritty, kitty, foot, wezterm, GNOME, etc.)
set -ag terminal-overrides ",*:Tc"

##### TPM plugins
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_show_git 0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-yank'

run -b '~/.tmux/plugins/tpm/tpm'


