# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

[git_branch]
format = "on [ $branch ->   $remote_name/$remote_branch]($style) "
always_show_remote = true
style = 'red bold'

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
